<sly data-sly-use.model="com.dept.contentbridge.core.models.impl.TitleModel"
     data-sly-test.content="${model.content}"></sly>
<h2 class="cb-title cb-title--${content.size} cb-align-${content.textAlignment}">${content.text}</h2>
<sly data-sly-call="${placeholder @ isEmpty = !content.text}"></sly>

<sly data-sly-template.placeholder="${@ isEmpty}">
    <sly data-sly-test="${isEmpty && wcmmode.edit}">
        <div class="cq-placeholder" data-emptytext="${component.title}"></div>
    </sly>
</sly>
