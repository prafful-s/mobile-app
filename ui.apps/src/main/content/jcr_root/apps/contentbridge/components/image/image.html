<sly data-sly-use.model="com.dept.contentbridge.core.models.impl.ImageModel"
     data-sly-test.content="${model.content}"></sly>
<a class="cb-image" data-sly-test="${content.link}" href="${content.link}">
    <img src="${content.image @ context='uri'}" alt="${content.alt}"/>
</a>
<img class="cb-image" data-sly-test="${!content.link && content.image}" src="${content.image @ context='uri'}" alt="${content.alt}"/>
<sly data-sly-call="${placeholder @ isEmpty = !content.image}"></sly>

<sly data-sly-template.placeholder="${@ isEmpty}">
    <sly data-sly-test="${isEmpty && wcmmode.edit}">
        <div class="cq-placeholder" data-emptytext="${component.title}"></div>
    </sly>
</sly>
